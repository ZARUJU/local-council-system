[project]
name = "local-council-system"
version = "0.1.0"
description = "地方議会会議録の収集・変換・配布"
readme = "README.md"
authors = [
    { name = "ZARUJU", email = "0613akb48@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
local-council-system = "local_council_system:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
